<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coloring Board</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section id="color-pallete">
        <button id="clear-btn">Clear</button>
        <button class="color-swatch" data-color="red"></button>
        <button class="color-swatch" data-color="orangered"></button>
        <button class="color-swatch" data-color="orange"></button>
        <button class="color-swatch" data-color="gold"></button>
        <button class="color-swatch" data-color="yellow"></button>
        <button class="color-swatch" data-color="yellowgreen"></button>
        <button class="color-swatch" data-color="green"></button>
        <button class="color-swatch" data-color="seagreen"></button>
        <button class="color-swatch" data-color="teal"></button>
        <button class="color-swatch" data-color="cyan"></button>
        <button class="color-swatch" data-color="skyblue"></button>
        <button class="color-swatch" data-color="blue"></button>
        <button class="color-swatch" data-color="navy"></button>
        <button class="color-swatch" data-color="purple"></button>
        <button class="color-swatch" data-color="violet"></button>
        <button class="color-swatch" data-color="magenta"></button>
        <button class="color-swatch" data-color="pink"></button>
        <button class="color-swatch" data-color="brown"></button>
        <button class="color-swatch" data-color="saddlebrown"></button>
        <button class="color-swatch" data-color="gray"></button>
        <button class="color-swatch" data-color="black"></button>
    </section>
    <section id="coloring-board">
    </section>
    <script src="script.js"></script>
</body>

</html>
