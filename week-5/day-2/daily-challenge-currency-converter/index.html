<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Currency Converter</title>
</head>
<body>
    <header><h1>Currency Converter</h1></header>
    <main>
        <form action="" id="currency-converter-input">
            <select name="currnet-currency" id="current-currency" type="dropdown" class="dropdowns"></select>
            <select name="desired-currency" id="desired-currency" type="dropdown" class="dropdowns"></select>
            <button id="Switch" name="switch" type="button">Switch</button>
            <input type="number" id="amount" name="amount">
            <button id="submit-button" name="submit-button">Submit</button>

        </form>
        <div id="result-div"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
